    <style>
        :root {
            --bg-paper: #ffffff;
            --cell-green-dark: #81c784;
            --cell-green-light: #dcedc8;
            --cell-white: #f9f9f9;
            --header-bg: #e0e0e0;
            --text-black: #000000;
            --text-red: #d63031;
            --border-color: #333333;
            --font-serif: 'Times New Roman', Times, serif;
            --font-sans: 'Microsoft YaHei', 'SimHei', sans-serif;
            
            /* 定义固定尺寸以防止遮挡 */
            --cell-width: 74px;
            --cell-height: 94px;
            --gap-size: 2px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-paper);
            color: var(--text-black);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 10px 20px;
            border-bottom: 2px solid var(--text-black);
            display: flex; justify-content: space-between; align-items: center; background: #fdfdfd; flex-shrink: 0;
        }

        h1 { font-family: 'KaiTi', '楷体', serif; font-size: 1.8rem; letter-spacing: 2px; font-weight: bold; }
        .legend-box { display: flex; gap: 15px; font-size: 0.8rem; flex-wrap: wrap;}
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .color-block { width: 15px; height: 15px; border: 1px solid #000; }

        /* --- 主体滚动容器 --- */
        .table-scroll-container {
            flex-grow: 1;
            overflow: auto; /* 允许横向和纵向滚动 */
            padding: 20px;
            display: flex;
            justify-content: center; /* 内容居中 */
            align-items: flex-start;
        }

        /* --- 超级网格系统 (包含表头和元素) --- */
        .super-grid {
            display: grid;
            /* 定义列宽：左表头 | 18个元素列(固定宽) | 右表头 */
            grid-template-columns: 30px repeat(18, var(--cell-width)) 50px;
            /* 定义行高：上表头1(数字) | 上表头2(罗马) | 7个周期 | 间隙 | 2个镧锕系 */
            grid-template-rows: 25px 25px repeat(7, var(--cell-height)) 20px repeat(2, var(--cell-height));
            gap: var(--gap-size);
            border: 1px solid #ccc;
            padding: 2px;
            background: #eee;
            /* 确保最小宽度，防止挤压 */
            min-width: max-content;
        }

        /* 表头单元格通用样式 */
        .header-cell {
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-serif); font-weight: bold; color: #555; background: var(--header-bg);
            font-size: 0.9rem; text-align: center;
        }
        .header-cell.roman { font-size: 0.75rem; } /* 罗马数字稍小 */
        .header-cell.shell-info { flex-direction: column; font-size: 0.7rem; line-height: 1.2; }

        /* --- 元素格子样式 --- */
        .element {
            border: 1px solid var(--border-color);
            position: relative; cursor: pointer; transition: transform 0.1s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; height: 100%; /* 填满网格单元 */
            background: var(--cell-white);
        }

        .element:hover {
            transform: scale(1.08); z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.3); border: 2px solid #000;
        }

        .bg-green { background-color: var(--cell-green-dark); }
        .bg-light { background-color: var(--cell-green-light); }
        .bg-white { background-color: var(--cell-white); }

        /* 格子内部布局 (紧凑调整) */
        .el-num { position: absolute; top: 2px; left: 3px; font-family: var(--font-serif); font-size: 0.7rem; font-weight: bold; }
        .el-sym { font-family: var(--font-serif); font-size: 1.6rem; font-weight: bold; line-height: 1; margin-top: 8px; }
        .radioactive .el-sym { color: var(--text-red); }
        .el-cn { font-family: 'KaiTi', '楷体', serif; font-size: 0.85rem; margin-top: 2px; font-weight: bold; }
        .el-mass { font-family: var(--font-serif); font-size: 0.65rem; position: absolute; bottom: 2px; left: 0; width: 100%; text-align: center; }
        
        /* 电子排布调整 */
        .el-config {
            position: absolute; top: 2px; right: 2px; text-align: right;
            font-family: var(--font-serif); font-size: 0.5rem; line-height: 1.05; color: #333;
            white-space: nowrap; /* 防止换行 */
        }
        .el-config sup { font-size: 0.85em; vertical-align: super; }

        /* --- 弹窗详情卡片 --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(2px);
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        .card { width: 900px; height: 600px; background: #fff; border: 2px solid #000; box-shadow: 10px 10px 0px rgba(0,0,0,0.1); display: flex; }
        .visual-side { width: 50%; background: #f9f9f9; position: relative; border-right: 1px solid #ccc; }
        .info-side { width: 50%; padding: 40px; display: flex; flex-direction: column; overflow-y: auto;}
        .info-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .big-sym { font-family: var(--font-serif); font-size: 4rem; font-weight: bold; line-height: 0.8; }
        .big-name { font-family: 'KaiTi', serif; font-size: 2rem; }
        .info-table { width: 100%; border-collapse: collapse; font-family: var(--font-serif); }
        .info-table td { padding: 8px 0; border-bottom: 1px dashed #ccc; font-size: 1.1rem; }
        .label { font-weight: bold; color: #555; width: 140px; }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 2rem; cursor: pointer; color: #999; }
        .close-btn:hover { color: #000; }
        #canvas-container { width: 100%; height: 100%; }
    </style>
</head>

        const parts = str.split(' ').filter(p => !p.startsWith('['));
        // 只取最后两个显示，否则太挤
        const displayParts = parts.slice(-2); 
        let html = '';

    const superGrid = document.getElementById('superGrid');

    // 1. 添加表头函数
    function addHeader(text, col, row, className = '') {
        const div = document.createElement('div');
        div.className = `header-cell ${className}`;
        div.innerHTML = text;
        // 坐标偏移: 加上左侧和上方的表头占用
        div.style.gridColumn = col + 1;
        div.style.gridRow = row + 2;
        superGrid.appendChild(div);
    }

    // 2. 生成顶部表头 (数字 1-18 和 罗马 IA-0)
    const groupRomans = ['IA','IIA','IIIB','IVB','VB','VIB','VIIB','VIII','VIII','VIII','IB','IIB','IIIA','IVA','VA','VIA','VIIA','0'];
    for(let i=1; i<=18; i++) {
        // 数字表头 (Row 1 in grid terms)
        const divNum = document.createElement('div');
        divNum.className = 'header-cell'; divNum.innerText = i;
        divNum.style.gridColumn = i + 1; divNum.style.gridRow = 1;
        superGrid.appendChild(divNum);
        // 罗马表头 (Row 2 in grid terms)
        const divRoman = document.createElement('div');
        divRoman.className = 'header-cell roman'; divRoman.innerText = groupRomans[i-1];
        divRoman.style.gridColumn = i + 1; divRoman.style.gridRow = 2;
        superGrid.appendChild(divRoman);
    }

    // 3. 生成左侧表头 (周期 1-7)
    for(let i=1; i<=7; i++) {
        const divPer = document.createElement('div');
        divPer.className = 'header-cell'; divPer.innerText = i;
        // 坐标偏移: 加上上方两行表头
        divPer.style.gridColumn = 1; divPer.style.gridRow = i + 2;
        superGrid.appendChild(divPer);
    }

    // 4. 生成右侧表头 (电子层 K-Q)
    const shells = [
        {L:'K', N:'2'}, {L:'L', N:'8'}, {L:'M', N:'18'}, {L:'N', N:'32'},
        {L:'O', N:'50'}, {L:'P', N:'72'}, {L:'Q', N:'98'}
    ];
    shells.forEach((s, i) => {
        const divShell = document.createElement('div');
        divShell.className = 'header-cell shell-info'; 
        divShell.innerHTML = `<div>${s.L}</div><div style="font-weight:normal">${s.N}</div>`;
        divShell.style.gridColumn = 20; // 最后一列
        divShell.style.gridRow = i + 3; // 从第3行开始(对应周期1)
        superGrid.appendChild(divShell);
    });

    // 5. 填充元素
    elements.forEach(d => {
        const [num, sym, cn, en, mass, cat, conf, col, row] = d;
        const el = document.createElement('div');
        let colorClass = 'bg-white';
        if(cat === 'nm' || cat === 'ng') colorClass = 'bg-green'; else if(cat === 'mt') colorClass = 'bg-light';
        const isRadio = isRadioactive(num);
        el.className = `element ${colorClass} ${isRadio ? 'radioactive' : ''}`;
        
        // 坐标计算 (关键：加上表头的偏移量)
        // 列 +1 (左表头), 行 +2 (上表头)
        let gCol = col + 1; let gRow = row + 2;
        // 镧系锕系特殊处理，放到下方
        if(num >= 58 && num <= 71) { gRow = 11; gCol = num - 58 + 5; } // +5 是为了对齐到 IIIB 之后
        if(num >= 90 && num <= 103) { gRow = 12; gCol = num - 90 + 5; }

        el.style.gridColumn = gCol; el.style.gridRow = gRow;
        // 镧系/锕系标签占位
        if(num === 57) { // La 旁边加标签
             addHeader("镧系", 4, 9, 'roman');
        }
        if(num === 89) { // Ac 旁边加标签
             addHeader("锕系", 4, 10, 'roman');
        }

        el.innerHTML = `
            <span class="el-num">${num}</span>
            <div class="el-config">${formatConfigSmall(conf)}</div>
            <span class="el-sym">${sym}</span>
            <span class="el-cn">${cn}</span>
            <span class="el-mass">${mass}</span>
        `;
        el.onclick = () => openCard(d);
        superGrid.appendChild(el);
    });

    // --- 详情弹窗逻辑 ---
    const overlay = document.getElementById('overlay');
    function openCard(d) {
        const [num, sym, cn, en, mass, cat, conf, col, row, phase] = d;
        document.getElementById('dSym').innerText = sym;
        document.getElementById('dSym').style.color = isRadioactive(num) ? '#d63031' : '#000';
        document.getElementById('dCn').innerText = cn;
        document.getElementById('dNum').innerText = num;
        document.getElementById('dEn').innerText = en;
        document.getElementById('dMass').innerText = mass;
        document.getElementById('dConfRaw').innerHTML = conf.replace(/(\d)([spdf])(\d+)/g, '$1$2<sup>$3</sup>');
        document.getElementById('dCat').innerText = catInfo[cat] || '未知';
        document.getElementById('dPhase').innerText = phase === 'Gas' ? '气态' : '固态/液态';
        overlay.classList.add('active');
        visualizeAtom(conf);
    }
    function closeCard() { overlay.classList.remove('active'); }
    overlay.addEventListener('click', (e) => { if(e.target===overlay) closeCard(); });

    // --- 3D 可视化 (保持不变) ---
    let scene, camera, renderer, atomGroup, controls;
    let electrons = []; let time = 0;
    function initThree() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene(); scene.background = new THREE.Color(0xf9f9f9);
        camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.1, 100); camera.position.z = 14;
        renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setSize(container.clientWidth, container.clientHeight);
        container.innerHTML = ''; container.appendChild(renderer.domElement);
        const hint = document.createElement('div'); hint.style.cssText = "position:absolute; bottom:10px; left:10px; font-size:0.8rem; color:#888;"; hint.innerText = "* 3D示意图：s/p/d/f 电子云"; container.appendChild(hint);
        controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.autoRotate = true;
        const light = new THREE.PointLight(0xffffff, 1, 50); light.position.set(10, 10, 20); scene.add(light); scene.add(new THREE.AmbientLight(0x888888));
        atomGroup = new THREE.Group(); scene.add(atomGroup); animate();
    }
    function createOrbital(type, size, color) {
        const mat = new THREE.MeshBasicMaterial({color: color, wireframe: true, opacity: 0.3, transparent: true, side: THREE.DoubleSide});
        if(type==='s') return new THREE.Mesh(new THREE.SphereGeometry(size, 32, 32), mat);
        if(type==='p') { const g = new THREE.Group(); const geo = new THREE.SphereGeometry(size/1.6, 16, 16); geo.scale(0.8, 1.4, 0.8); const m1 = new THREE.Mesh(geo, mat); m1.position.y = size/1.6; const m2 = new THREE.Mesh(geo, mat); m2.position.y = -size/1.6; g.add(m1, m2); return g; }
        const g = new THREE.Group(); const geo = new THREE.SphereGeometry(size/2, 16, 16); geo.scale(0.6, 1.5, 0.6); for(let i=0; i<4; i++) { const m = new THREE.Mesh(geo, mat); m.rotation.z = (Math.PI/2)*i; m.position.set(Math.cos((Math.PI/2)*i+Math.PI/4)*size/1.5, Math.sin((Math.PI/2)*i+Math.PI/4)*size/1.5, 0); m.lookAt(0,0,0); g.add(m); }
        if(type==='f') { const ex = g.clone(); ex.rotation.x = Math.PI/2; g.add(ex); } return g;
    }
    function visualizeAtom(configStr) {
        if(!renderer) initThree(); while(atomGroup.children.length > 0) atomGroup.remove(atomGroup.children[0]); electrons = [];
        const nucleus = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshBasicMaterial({color: 0x555555})); atomGroup.add(nucleus);
        const parts = configStr.split(' ').filter(p => !p.startsWith('[')); const colors = {s:0x2980b9, p:0x27ae60, d:0xe67e22, f:0x8e44ad};
        parts.forEach((p, i) => {
            const match = p.match(/(\d)([spdf])(\d+)/); if(!match) return; const type = match[2], count = parseInt(match[3]); const radius = 2 + i * 1.5; const color = colors[type];
            const orb = createOrbital(type, radius, color); orb.rotation.set(Math.random()*3, Math.random()*3, 0); atomGroup.add(orb);
            for(let k=0; k<count; k++) { const elMesh = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({color: color})); atomGroup.add(elMesh); electrons.push({ mesh:elMesh, type:type, radius:radius, offset:Math.random()*10, rotation:orb.rotation }); }
        });
    }
    function animate() {
        requestAnimationFrame(animate); if(controls) controls.update(); time += 0.01;
        electrons.forEach(e => { const t = time + e.offset; const r = e.radius; let x=0,y=0,z=0; if(e.type==='s') { x=Math.cos(t)*r; y=Math.sin(t)*r; z=Math.sin(t*0.5)*r*0.5; } else if(e.type==='p') { y=Math.sin(t)*r; z=Math.sin(2*t)*r*0.5; } else { x=Math.cos(2*t)*r; y=Math.sin(3*t)*r; z=Math.cos(t)*r*0.3; } const v = new THREE.Vector3(x,y,z); if(e.type!=='s') v.applyEuler(e.rotation); e.mesh.position.copy(v); });
        renderer.render(scene, camera);
    }
    window.addEventListener('resize', () => { const container = document.getElementById('canvas-container'); if(renderer && container) { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); } });
</script>
